version: "3.9"

services:

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PAYSWIFT_URL: http://payswift:8080
    volumes:
      - ./data:/app/data
    depends_on:
      - payswift
    restart: unless-stopped


  payswift:
    build: ./payswift
    ports:
      - "8080:8080"
    restart: unless-stopped
